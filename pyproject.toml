[project]
name = "e2m-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "accelerate>=1.14.0",
    "celery>=5.6.3",
    "controlnet-aux>=0.0.10",
    "diffusers>=0.40.0",
    "fastapi>=0.141.1",
    "numpy>=1.26,<2",
    "opencv-python>=4.10.0,<5.0.0",
    "scipy>=1.13.0,<1.14.0",
    "piexif>=1.1.3",
    "pillow>=12.3.0",
    "pytest>=9.1.1",
    "redis>=8.1.0",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "transformers>=5.16.1",
    "ultralytics>=8.4.138",
    "uvicorn>=0.52.4",
    "weasyprint>=69.0",
    "timm>=1.0.17",
    "ftfy==6.1.1",
    "regex",
    "iopath>=0.1.10",
    "einops>=0.8.2",
    "pycocotools>=2.0.11",
    "psutil>=7.0.0",
    "huggingface-hub",
    "triton-windows>=3.8.0.post28 ; sys_platform == 'win32'",
    "sam3",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
sam3 = { path = "../sam3", editable = true }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
